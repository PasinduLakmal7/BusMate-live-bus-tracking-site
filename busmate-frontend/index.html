<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // Global error handler for debugging
    window.onerror = function (msg, url, line, col, error) {
      const errDiv = document.createElement('div');
      errDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:red;color:white;padding:10px;z-index:9999;font-size:12px;word-break:break-all;';
      errDiv.innerHTML = '<b>Runtime Error:</b> ' + msg + '<br>at ' + url + ':' + line;
      document.body.appendChild(errDiv);
    };

    // Critical: Apply dark mode immediately to avoid white flash
    (function () {
      try {
        const theme = localStorage.getItem('theme');
        const supportDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && supportDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        console.error("Theme init error:", e);
      }
    })();
  </script>
  <title>busMate</title>
</head>

<body>
  <div id="root">
    <h1 style="color: #3b82f6; text-align: center; margin-top: 50px; font-family: sans-serif;">BUSMATE CONNECTED -
      INITIALIZING...</h1>
  </div>
  <script type="module" crossorigin src="/src/main.jsx"></script>
</body>

</html>
